openapi: 3.0.3
info:
  title: TaxFront API
  description: Firebase HTTPS callable functions for TaxFront.
  version: 1.0.0
servers:
- url: https://us-central1-taxfront-1e142.cloudfunctions.net
security:
- firebaseIdToken: []
paths:
  /createUserProfile:
    post:
      operationId: createUserProfile
      summary: Create or update the caller’s profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: Callable result
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    $ref: '#/components/schemas/ProfileResult'
        default:
          description: Firebase callable error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
  /getTaxDocuments:
    post:
      operationId: getTaxDocuments
      summary: List the caller’s recent tax documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  maxProperties: 0
      responses:
        '200':
          description: Callable result
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    $ref: '#/components/schemas/DocumentsResult'
        default:
          description: Firebase callable error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
  /getTaxSummary:
    post:
      operationId: getTaxSummary
      summary: Summarize the caller’s recent tax documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  maxProperties: 0
      responses:
        '200':
          description: Callable result
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    $ref: '#/components/schemas/SummaryResult'
        default:
          description: Firebase callable error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
  /runFullAnalysis:
    post:
      operationId: runFullAnalysis
      summary: Run both tax analysis agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: '#/components/schemas/FullAnalysisInput'
      responses:
        '200':
          description: Callable result
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    $ref: '#/components/schemas/FullAnalysisResult'
        default:
          description: Firebase callable error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
  /runAccountant:
    post:
      operationId: runAccountant
      summary: Run the accountant agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: '#/components/schemas/AccountantInput'
      responses:
        '200':
          description: Callable result
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    $ref: '#/components/schemas/AgentResult'
        default:
          description: Firebase callable error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
  /runAuditor:
    post:
      operationId: runAuditor
      summary: Run the auditor agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: '#/components/schemas/AuditorInput'
      responses:
        '200':
          description: Callable result
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    $ref: '#/components/schemas/AgentResult'
        default:
          description: Firebase callable error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableError'
components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Authentication ID token.
  schemas:
    ProfileInput:
      type: object
      required:
      - name
      - taxId
      - businessType
      properties:
        name:
          type: string
          minLength: 1
        taxId:
          type: string
          minLength: 1
        businessType:
          type: string
          minLength: 1
    ProfileResult:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    DocumentsResult:
      type: object
      required:
      - documents
      properties:
        documents:
          type: array
          maxItems: 100
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: string
    SummaryResult:
      type: object
      required:
      - totalDocuments
      - documentTypes
      - lastUpdated
      properties:
        totalDocuments: &id001
          type: integer
          minimum: 0
        documentTypes:
          type: object
          additionalProperties: *id001
        lastUpdated:
          type: string
          nullable: true
    FullAnalysisInput:
      type: object
      properties:
        filingStatus: &id003
          type: string
          maxLength: 64
    FullAnalysisResult:
      type: object
      required:
      - status
      - userId
      - accountant
      - auditor
      properties:
        status: &id005
          type: string
          enum:
          - ok
        userId: &id002
          type: string
          minLength: 1
          maxLength: 128
          description: Firebase UID of the signed-in user.
        accountant:
          type: string
        auditor:
          type: string
    AccountantInput:
      type: object
      required:
      - userId
      properties:
        userId: *id002
        filingStatus: *id003
        task: &id004
          type: string
          maxLength: 16384
    AuditorInput:
      type: object
      required:
      - userId
      properties:
        userId: *id002
        task: *id004
    AgentResult:
      type: object
      required:
      - status
      - userId
      - output
      properties:
        status: *id005
        userId: *id002
        output:
          type: string
    CallableError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - status
          properties:
            status:
              type: string
            message:
              type: string
            details: {}
